name: CI Pipeline

on:
  push:
    branches: [main, Gptcoder]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Verify toolchain
        run: |
          node --version
          bun --version

      # bun.lock matches package.json; package-lock.json is stale and must not
      # be used for CI installs until it is regenerated and reviewed.
      - name: Install dependencies from the committed Bun lockfile
        run: bun install --frozen-lockfile

      - name: Run dependency vulnerability audit
        run: bun audit --audit-level=high

      - name: Run Linter
        run: bun run lint

      - name: Run TypeScript Type Check
        run: bunx tsc --noEmit

      - name: Run Unit Tests
        run: bun run test

      - name: Build Application with Bundle Analyzer
        run: bun run build
        env:
          ANALYZE: true

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright Privacy & Accessibility E2E Tests
        run: bunx playwright test
