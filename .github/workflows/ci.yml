name: CI Pipeline

on:
  push:
    branches: [main, Gptcoder]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm version
        run: |
          npm install --global npm@10.9.10
          node --version
          npm --version

      # Regenerate the npm lock from the authoritative package.json.
      # This repairs the stale lock on Gptcoder before using npm ci.
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies from the synchronized lockfile
        run: npm ci --no-audit --no-fund

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test

      - name: Build Application with Bundle Analyzer
        run: npm run build
        env:
          ANALYZE: "true"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Privacy & Accessibility E2E Tests
        run: npx playwright test

      # Only the Gptcoder branch may receive the regenerated lockfile commit.
      # GITHUB_TOKEN pushes do not start a second workflow run; this job has
      # already tested the exact lockfile that it commits.
      - name: Commit synchronized package-lock.json on Gptcoder
        if: success() && github.ref == 'refs/heads/Gptcoder'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
