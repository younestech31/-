name: CI Pipeline

on:
  push:
    branches: [main, Gptcoder, chore/manual-license-hardening, work/mawarith]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Use the committed lockfile exactly as reviewed; CI must never rewrite or push dependencies.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test

      - name: Build Application
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Privacy & Accessibility E2E Tests
        run: npx playwright test
