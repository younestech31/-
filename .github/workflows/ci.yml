name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Assert Node.js Version Matches Engines Constraint
        run: |
          NODE_VER=$(node -v)
          echo "Current Node version: $NODE_VER"
          if [[ "$NODE_VER" != v22* ]]; then
            echo "Node version $NODE_VER does not match required engines.node (22.x)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test

      - name: Build Application with Bundle Analyzer
        run: npm run build
        env:
          ANALYZE: true

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Privacy & Accessibility E2E Tests
        run: npx playwright test
