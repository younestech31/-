<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#274A38"/>
      <stop offset="100%" stop-color="#16281E"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- faint geometric star field, echoing manuscript border patterns, kept quiet -->
  <g opacity="0.07" stroke="#EFE8D8" stroke-width="1.5" fill="none">
    <circle cx="1080" cy="90" r="46"/>
    <circle cx="1080" cy="90" r="70"/>
    <circle cx="120" cy="560" r="40"/>
    <circle cx="120" cy="560" r="62"/>
  </g>

  <!-- icon mark, large, left side -->
  <g transform="translate(90,175) scale(2.6)">
    <circle cx="50" cy="27" r="14" fill="none" stroke="#EFE8D8" stroke-width="8"/>
    <circle cx="50" cy="27" r="3.1" fill="#D9A85E"/>
    <line x1="50" y1="41" x2="50" y2="59" stroke="#EFE8D8" stroke-width="8" stroke-linecap="round"/>
    <line x1="17" y1="59" x2="83" y2="59" stroke="#EFE8D8" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="17" y1="59" x2="17" y2="73" stroke="#D9A85E" stroke-width="4" stroke-linecap="round"/>
    <line x1="83" y1="59" x2="83" y2="73" stroke="#D9A85E" stroke-width="4" stroke-linecap="round"/>
    <path d="M 6 73 A 11 11 0 0 0 28 73" fill="none" stroke="#D9A85E" stroke-width="5" stroke-linecap="round"/>
    <path d="M 72 73 A 11 11 0 0 0 94 73" fill="none" stroke="#D9A85E" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- wordmark + tagline, right side -->
  <text x="1110" y="290" text-anchor="start"
        font-family="Amiri" font-weight="700" font-size="150"
        fill="#EFE8D8" direction="rtl">مواريث</text>
  <line x1="500" y1="330" x2="1110" y2="330" stroke="#D9A85E" stroke-width="3" stroke-linecap="round"/>
  <text x="1110" y="395" text-anchor="start"
        font-family="Cairo" font-weight="500" font-size="34"
        fill="#C9D3C4" direction="rtl">حاسبة المواريث الشرعية بدقّة وسهولة</text>
</svg>
